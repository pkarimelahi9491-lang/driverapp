<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به پنل مدیریت | هلدینگ آرمان انتخاب</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark-1: #07101E;
      --bg-dark-2: #0C192E;
      --bg-dark-3: #112240;
      --glass-surface: rgba(15, 29, 54, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-highlight: rgba(255, 255, 255, 0.25);
      --primary-blue: #3B82F6;
      --primary-gold: #F59E0B;
      --primary-green: #10B981;
      --primary-red: #EF4444;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0c1c38 0%, #060d19 90%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }

    .glow-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.18), transparent 70%);
      top: -100px;
      right: -100px;
    }

    .glow-2 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.14), transparent 70%);
      bottom: 50px;
      left: -100px;
    }

    .glow-3 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12), transparent 70%);
      top: 40%;
      right: 30%;
    }

    /* Login Screen */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 20%, #0c1c38 0%, #060d19 90%);
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .login-glass-card {
      background: rgba(15, 29, 54, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 80px rgba(59, 130, 246, 0.08);
      animation: scaleIn 0.4s ease;
    }

    @keyframes scaleIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-brand-badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #f59e0b, #b45309);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 16px;
    }

    .login-brand h1 {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .login-brand p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .login-field {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .login-field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .login-field input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: white;
      outline: none;
      font-size: 14px;
      width: 100%;
      transition: all 0.2s;
    }

    .login-field input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    .login-field input::placeholder {
      color: #64748b;
    }

    .password-input-wrapper {
      position: relative;
      display: flex;
    }

    .password-input-wrapper input {
      padding-left: 44px;
    }

    .toggle-password {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
    }

    .toggle-password:hover {
      color: var(--text-main);
    }

    .login-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 12px;
      color: #fca5a5;
      margin-bottom: 12px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .login-error.show {
      display: flex;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-sm);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s;
      margin-top: 8px;
      font-family: 'Vazirmatn', sans-serif;
    }

    .login-btn:hover {
      filter: brightness(1.15);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    .login-glass-card.shake {
      animation: shake 0.4s ease;
    }

    @keyframes fadeOutUp {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-30px) scale(0.95); }
    }

    .login-overlay.fade-out {
      animation: fadeOutUp 0.5s ease forwards;
      pointer-events: none;
    }

    /* Success screen */
    .login-success {
      text-align: center;
      display: none;
    }

    .login-success.show {
      display: block;
      animation: scaleIn 0.4s ease;
    }

    .success-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid #10b981;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #34d399;
      margin-bottom: 16px;
      animation: pulse 1.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.3); }
      50% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
    }

    .login-success h2 {
      font-size: 18px;
      font-weight: 700;
      color: #6ee7b7;
      margin-bottom: 8px;
    }

    .login-success p {
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-container">
      <div class="login-glass-card" id="loginCard">
        <!-- Login Form -->
        <div id="loginFormSection">
          <div class="login-brand">
            <div class="login-brand-badge">
              <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1>هلدینگ آرمان انتخاب</h1>
            <p>سامانه جامع مدیریت ناوگان و مأموریت</p>
          </div>
          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="login-field">
              <label for="loginUsername"><i class="fa-solid fa-user"></i> نام کاربری</label>
              <input type="text" id="loginUsername" placeholder="نام کاربری را وارد کنید" required autocomplete="username" value="admin">
            </div>
            <div class="login-field">
              <label for="loginPassword"><i class="fa-solid fa-lock"></i> رمز عبور</label>
              <div class="password-input-wrapper">
                <input type="password" id="loginPassword" placeholder="رمز عبور را وارد کنید" required autocomplete="current-password">
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                  <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                </button>
              </div>
            </div>
            <div id="loginError" class="login-error"></div>
            <button type="submit" class="login-btn">
              <i class="fa-solid fa-right-to-bracket"></i>
              ورود به پنل مدیریت
            </button>
          </form>
          <div class="login-footer">
            <i class="fa-solid fa-lock"></i>
            <span>ورود شما ایمن و رمزگذاری شده است</span>
          </div>
        </div>

        <!-- Success State -->
        <div class="login-success" id="loginSuccess">
          <div class="success-icon">
            <i class="fa-solid fa-check"></i>
          </div>
          <h2>ورود موفقیت‌آمیز!</h2>
          <p>در حال انتقال به پنل مدیریت...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errorEl = document.getElementById('loginError');
      const card = document.getElementById('loginCard');
      const formSection = document.getElementById('loginFormSection');
      const successSection = document.getElementById('loginSuccess');

      // Demo credentials
      const validUsername = 'admin';
      const validPasswordHash = await hashPassword('admin1403');
      const inputHash = await hashPassword(password);

      if (username === validUsername && inputHash === validPasswordHash) {
        errorEl.classList.remove('show');
        // Show success
        formSection.style.display = 'none';
        successSection.classList.add('show');
        // Redirect after animation
        setTimeout(() => {
          document.getElementById('loginOverlay').classList.add('fade-out');
          setTimeout(() => {
            document.getElementById('loginOverlay').style.display = 'none';
            document.body.innerHTML = `
              <div class="ambient-glow glow-1"></div>
              <div class="ambient-glow glow-2"></div>
              <div style="position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:60px 20px;text-align:center;">
                <div style="background:rgba(15,29,54,0.85);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:40px;box-shadow:0 24px 60px rgba(0,0,0,0.5);">
                  <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#f59e0b,#b45309);display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:white;margin-bottom:16px;"><i class="fa-solid fa-shield-halved"></i></div>
                  <h1 style="font-size:24px;font-weight:800;margin-bottom:8px;">پنل مدیریت هلدینگ آرمان انتخاب</h1>
                  <p style="color:#94A3B8;margin-bottom:24px;">با موفقیت وارد شدید ✅</p>
                  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;text-align:center;">
                    <div style="background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);border-radius:12px;padding:16px;">
                      <i class="fa-solid fa-users" style="font-size:24px;color:#60a5fa;"></i>
                      <p style="margin-top:8px;font-size:12px;color:#93c5fd;">رانندگان</p>
                    </div>
                    <div style="background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);border-radius:12px;padding:16px;">
                      <i class="fa-solid fa-route" style="font-size:24px;color:#fbbf24;"></i>
                      <p style="margin-top:8px;font-size:12px;color:#fcd34d;">مسیرها</p>
                    </div>
                    <div style="background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);border-radius:12px;padding:16px;">
                      <i class="fa-solid fa-receipt" style="font-size:24px;color:#34d399;"></i>
                      <p style="margin-top:8px;font-size:12px;color:#6ee7b7;">مالی</p>
                    </div>
                  </div>
                  <p style="margin-top:24px;font-size:11px;color:#64748B;">پنل کامل ادmin در فایل index.html اصلی قرار دارد</p>
                </div>
              </div>
            `;
          }, 500);
        }, 1200);
      } else {
        errorEl.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> نام کاربری یا رمز عبور اشتباه است';
        errorEl.classList.add('show');
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 400);
        document.getElementById('loginPassword').value = '';
        document.getElementById('loginPassword').focus();
      }
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('loginPassword');
      const icon = document.getElementById('togglePasswordIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
</body>
</html>
