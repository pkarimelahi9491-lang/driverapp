# ═══════════════════════════════════════════════════════════════════
# Arman Fleet - Docker Compose
# Backend API + Supabase PostgreSQL
# ═══════════════════════════════════════════════════════════════════

version: '3.8'

services:

  # ─── PostgreSQL محلی ────────────────────────────────────────────
  # فعلاً نگهش می‌داریم تا اطلاعات قبلی از بین نرود.
  # Backend دیگر از این دیتابیس استفاده نمی‌کند.
  postgres:
    image: postgres:16-alpine
    container_name: arman-fleet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arman
      POSTGRES_PASSWORD: arman_secret_123
      POSTGRES_DB: arman_fleet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arman -d arman_fleet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: arman-fleet-api

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}

      # اتصال Prisma به PostgreSQL در Supabase
      DATABASE_URL: ${DATABASE_URL}

      # Supabase
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}

      CORS_ORIGIN: ${CORS_ORIGIN}

    # فعلاً وابستگی به PostgreSQL محلی را حذف می‌کنیم
    # چون DATABASE_URL به Supabase اشاره می‌کند.

volumes:
  pgdata:
