version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: arman-fleet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arman
      POSTGRES_PASSWORD: arman_secret_123
      POSTGRES_DB: arman_fleet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arman -d arman_fleet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
